name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install development and signing dependencies
        run: |
          uv venv .venv
          uv pip install --python .venv/bin/python -e '.[dev,signing]'
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
      - name: Test
        if: matrix.python-version != '3.11'
        run: pytest -q
      - name: Test with branch coverage
        if: matrix.python-version == '3.11'
        run: |
          coverage run -m pytest -q
          coverage report
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy src
      - name: Audit exact development and signing dependencies
        run: |
          uv venv .venv-audit
          uv pip install --python .venv-audit/bin/python pip-audit
          bash scripts/audit-dependencies.sh .venv/bin/python .audit/dev .venv-audit/bin/pip-audit

  core-import:
    name: Core wheel without signing dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          python-version: '3.11'
      - name: Build wheel with an inventoried backend
        run: |
          mkdir -p .audit
          uv venv .venv-build
          .venv-build/bin/python -I -c 'import tomllib; print("\n".join(tomllib.load(open("pyproject.toml", "rb"))["build-system"]["requires"]))' > .audit/build-requirements.txt
          uv pip install --python .venv-build/bin/python -r .audit/build-requirements.txt
          uv pip freeze --python .venv-build/bin/python > .audit/build-before.freeze
          uv build --python .venv-build/bin/python --wheel --no-build-isolation
          uv pip freeze --python .venv-build/bin/python > .audit/build-after.freeze
          cmp .audit/build-before.freeze .audit/build-after.freeze
          sha256sum dist/*.whl
      - name: Verify installed core wheel
        run: |
          uv venv .venv-core
          uv pip install --python .venv-core/bin/python dist/*.whl
          .venv-core/bin/python -I tests/core_smoke.py
      - name: Audit exact backend and core dependencies
        run: |
          uv venv .venv-audit
          uv pip install --python .venv-audit/bin/python pip-audit
          bash scripts/audit-dependencies.sh .venv-build/bin/python .audit/build .venv-audit/bin/pip-audit
          bash scripts/audit-dependencies.sh .venv-core/bin/python .audit/core .venv-audit/bin/pip-audit

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install development and signing dependencies
        run: |
          uv venv .venv
          uv pip install --python .venv/bin/python -e '.[dev,signing]'
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
      - name: Test
        run: pytest -q
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy src

  core-import:
    name: Core import without signing dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10
        with:
          python-version: '3.11'
      - name: Install core dependencies only
        run: |
          uv venv .venv
          uv pip install --python .venv/bin/python -e .
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
      - name: Verify isolated core import
        run: |
          python -I -c "import importlib.util; assert importlib.util.find_spec('cryptography') is None; import folio_propositions"
